name: Validate Skills

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'knowledge/04-Examples/**'
      - 'knowledge/02-Techniques/**'
      - 'manifest.json'
      - 'spec.json'
      - 'scripts/validate-skills.sh'
      - 'scripts/validate-manifest.sh'
      - 'scripts/test-benchmark.sh'
      - 'scripts/benchmark-skill.sh'
      - 'scripts/test-editing-fixtures.sh'
      - 'scripts/check-examples-facts.sh'
      - 'tests/fixtures/editing/**'
      - 'scripts/check-editing-output.sh'
      - 'scripts/check-examples-coverage.sh'
      - 'scripts/check-knowledge-links.sh'
      - 'scripts/check-manifest-versions.sh'
      - 'scripts/check-no-stale-contract.sh'
      - 'scripts/collect-ru-corpus.sh'
      - 'docs/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'prompts/**'
      - 'knowledge/04-Examples/**'
      - 'knowledge/02-Techniques/**'
      - 'manifest.json'
      - 'spec.json'
      - 'scripts/validate-skills.sh'
      - 'scripts/validate-manifest.sh'
      - 'scripts/test-benchmark.sh'
      - 'scripts/benchmark-skill.sh'
      - 'scripts/test-editing-fixtures.sh'
      - 'scripts/check-examples-facts.sh'
      - 'tests/fixtures/editing/**'
      - 'scripts/check-editing-output.sh'
      - 'scripts/check-examples-coverage.sh'
      - 'scripts/check-knowledge-links.sh'
      - 'scripts/check-manifest-versions.sh'
      - 'scripts/check-no-stale-contract.sh'
      - 'scripts/collect-ru-corpus.sh'
      - 'docs/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-mathc-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: true

      - name: Run validation
        run: ./scripts/validate-skills.sh .

      - name: Validate manifest paths
        run: ./scripts/validate-manifest.sh

      - name: Run benchmark smoke tests
        run: ./scripts/test-benchmark.sh

      - name: Validate editing fixtures
        run: ./scripts/test-editing-fixtures.sh

      - name: Check that examples preserve source facts
        run: ./scripts/check-examples-facts.sh

      - name: Build the math-coding binary
        run: |
          set -euo pipefail
          nix build .#mathc --no-link
          mkdir -p "$HOME/.local/bin"
          cp "$(nix path-info .#mathc)/bin/mathc" "$HOME/.local/bin/mathc"
          # The OCaml 5 runtime sizes its signal stack from SIGSTKSZ, which
          # follows the stack rlimit. GitHub runners leave it unlimited, and
          # the allocation then fails with "Failed to allocate signal stack".
          ulimit -s 8192
          "$HOME/.local/bin/mathc" --version

      - name: Bind evidence and check the verdict
        run: |
          set -euo pipefail
          "$HOME/.local/bin/mathc" --root . run
          "$HOME/.local/bin/mathc" --root . doctor

      - name: Check for stray em-dash patterns
        run: |
          echo "Checking for excessive em-dash in skills (limit: 1 per 300 words in descriptions)"
          for skill_md in skills/*/SKILL.md; do
            if [[ -f "$skill_md" ]]; then
              em=$(grep -o '—' "$skill_md" | wc -l)
              words=$(wc -w < "$skill_md")
              if [[ $words -gt 0 ]]; then
                per_300=$(python3 -c "print($em * 300 / $words)")
                # Allow up to 5 per 300 in examples; flag if > 10
                if (( $(echo "$per_300 > 10" | bc -l) )); then
                  echo "::warning::$skill_md has $per_300 em-dashes per 300 words (too many)"
                else
                  echo "✓ $skill_md: $per_300 em-dashes per 300 words"
                fi
              fi
            fi
          done